name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Allow only 1 CD workflow at a time
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  create_release:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: ci
    permissions:
      contents: write

    env:
      RELEASE_VERSION: v0.1.${{ github.run_number }}
      # Baked into the exe; the self-updater compares it with the latest release.
      # Without it every build reports 0.1.0 and keeps updating itself.
      HADDYSIMHUB_VERSION: v0.1.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache cargo registry and build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-release-${{ runner.os }}-

    - name: Build release executable
      run: cargo build --release --locked -p simhub-app

    # The updater takes HaddySimHub.exe from the root of this archive.
    - name: Zip build result
      run: Compress-Archive -Path ./target/release/HaddySimHub.exe -DestinationPath ./haddy-simhub.zip

    - name: Create release and upload assets
      run: gh release create ${{ env.RELEASE_VERSION }} haddy-simhub.zip --title "Release ${{ env.RELEASE_VERSION }}" --notes "Automated Release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
