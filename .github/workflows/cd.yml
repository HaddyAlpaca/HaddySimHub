name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Allow only 1 CD workflow at a time
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  create_release:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: ci
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./rust

    env:
      RELEASE_VERSION: v0.1.${{ github.run_number }}
      # Baked into the exe; the self-updater compares it with the latest release.
      # Without it every build reports 0.1.0 and keeps updating itself.
      HADDYSIMHUB_VERSION: v0.1.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

    - name: Cache cargo registry and build output
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          rust/target
        key: cargo-release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
        restore-keys: |
          cargo-release-${{ runner.os }}-

    - name: Build release executable
      run: cargo build --release --locked -p simhub-app

    # The updater takes HaddySimHub.exe from the root of this archive.
    - name: Zip build result
      run: Compress-Archive -Path ./target/release/HaddySimHub.exe -DestinationPath ../haddy-simhub.zip

    - name: Create release and upload assets
      working-directory: .
      run: gh release create ${{ env.RELEASE_VERSION }} haddy-simhub.zip --title "Release ${{ env.RELEASE_VERSION }}" --notes "Automated Release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
